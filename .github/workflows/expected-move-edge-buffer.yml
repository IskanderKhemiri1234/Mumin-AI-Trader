name: Smart Sniper Expected-Move Edge Buffer OOS Ablation

on:
  push:
    branches:
      - research/expected-move-edge-buffer
    paths:
      - "scripts/run_expected_move_edge_buffer.py"
      - "scripts/run_binance_walk_forward.py"
      - "src/mumin_trader/strategy/smart_sniper.py"
      - "src/mumin_trader/research/walk_forward.py"
      - "tests/unit/test_smart_sniper.py"
      - "tests/unit/test_walk_forward.py"
      - ".github/workflows/expected-move-edge-buffer.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expected-move-edge-buffer-oos
  cancel-in-progress: false

jobs:
  paired-oos-ablation:
    name: Paired Paper OOS holdout (8 symbols, 4 spreads)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and research checks
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile source and scripts
        run: python -m compileall -q src scripts
      - name: Run full test suite
        run: pytest -q
      - name: Ruff lint
        run: |
          ruff check --select E,F,I,UP scripts/run_expected_move_edge_buffer.py src/mumin_trader/strategy/smart_sniper.py src/mumin_trader/research/walk_forward.py tests/unit/test_smart_sniper.py
      - name: Run frozen paired OOS holdout
        run: |
          mkdir -p artifacts
          python scripts/run_expected_move_edge_buffer.py \
            --output artifacts/expected-move-edge-buffer-oos.json
      - name: Upload paired OOS ledger and report data
        uses: actions/upload-artifact@v4
        with:
          name: expected-move-edge-buffer-oos-${{ github.run_number }}
          path: artifacts/expected-move-edge-buffer-oos.json
          if-no-files-found: error
          retention-days: 30
