name: Clean Profit Core Research CI

on:
  push:
    branches:
      - research/clean-profit-core
  pull_request:
    branches:
      - main
    paths:
      - "docs/research/clean-profit-core.md"
      - "src/mumin_trader/**"
      - "tests/**"
      - "android/**"
      - "dashboard/**"
      - ".github/workflows/clean-profit-core.yml"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: clean-profit-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Full Python compile, tests and Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: research/clean-profit-core
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile source and tests
        run: python -m compileall -q src config scripts tests
      - name: Run complete Pytest suite
        run: pytest -q
      - name: Run complete Ruff checks
        run: ruff check src config scripts tests

  android-build:
    name: Android debug APK verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: research/clean-profit-core
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug --project-dir android
      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "package: name='com.mumin.aitrader'"
          mkdir -p dist
          cp "$APK" dist/Mumin-AI-Trader.apk
          sha256sum dist/Mumin-AI-Trader.apk | tee dist/SHA256SUMS.txt
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Mumin-AI-Trader-Research-APK
          path: |
            dist/Mumin-AI-Trader.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
