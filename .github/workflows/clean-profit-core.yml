name: Clean Profit Core Research CI

on:
  push:
    branches:
      - research/clean-profit-core
  pull_request:
    branches:
      - main
    paths:
      - "docs/research/clean-profit-core.md"
      - "src/mumin_trader/**"
      - "tests/**"
      - ".github/workflows/clean-profit-core.yml"

permissions:
  contents: read

concurrency:
  group: clean-profit-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Compile, focused tests, Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: research/clean-profit-core
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile source and tests
        run: python -m compileall -q src config scripts tests
      - name: Focused Paper and strategy-boundary tests
        run: |
          pytest -q \
            tests/unit/test_scanner.py \
            tests/unit/test_risk_engine.py \
            tests/unit/test_paper_execution.py \
            tests/integration/test_execution_disabled.py \
            tests/test_public_market_data.py \
            tests/test_continuous_paper.py
      - name: Ruff critical lint checks
        run: ruff check --select E4,E7,E9,F src config scripts tests
