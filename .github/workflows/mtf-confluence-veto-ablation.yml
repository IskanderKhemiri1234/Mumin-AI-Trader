name: Smart Sniper MTF Final-Veto OOS Ablation

on:
  push:
    branches:
      - research/mtf-confluence-veto-ablation
    paths:
      - "scripts/run_mtf_confluence_veto_ablation.py"
      - "scripts/run_binance_walk_forward.py"
      - "src/mumin_trader/strategy/smart_sniper.py"
      - "src/mumin_trader/research/walk_forward.py"
      - "tests/unit/test_smart_sniper.py"
      - "tests/unit/test_walk_forward.py"
      - ".github/workflows/mtf-confluence-veto-ablation.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mtf-confluence-veto-ablation-oos
  cancel-in-progress: false

jobs:
  paired-oos-ablation:
    name: Quality gates then sealed Paper holdout
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and research checks
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile source and scripts
        run: python -m compileall -q src scripts
      - name: Run full pytest suite
        run: pytest -q
      - name: Ruff lint all changed Python files
        run: |
          ruff check --select E,F,I,UP scripts/run_mtf_confluence_veto_ablation.py src/mumin_trader/strategy/smart_sniper.py src/mumin_trader/research/walk_forward.py tests/unit/test_smart_sniper.py tests/unit/test_walk_forward.py
      - name: Run frozen paired MTF final-veto holdout
        run: |
          mkdir -p artifacts
          python scripts/run_mtf_confluence_veto_ablation.py --output artifacts/mtf-confluence-veto-oos.json
      - name: Upload paired OOS ledger
        uses: actions/upload-artifact@v4
        with:
          name: mtf-confluence-veto-oos-${{ github.run_number }}
          path: artifacts/mtf-confluence-veto-oos.json
          if-no-files-found: error
          retention-days: 30
