name: Mumin AI Trader Signed Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.2.0"
        required: true
        default: "1.2.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Decode and validate private signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/mumin-release-key.jks"
          export KEYSTORE_PATH

          python - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          value = os.environ.get("ANDROID_KEYSTORE_BASE64", "")
          if not value.strip():
              raise SystemExit("ANDROID_KEYSTORE_BASE64 is empty.")

          # Accept pasted Base64 with line breaks, spaces, surrounding quotes,
          # an optional data-URI/base64: prefix, or URL-safe Base64 characters.
          normalized = value.strip().replace("\\n", "").replace("\\r", "")
          normalized = re.sub(r"^data:[^,]*;base64,", "", normalized, flags=re.I)
          if normalized.lower().startswith("base64:"):
              normalized = normalized.split(":", 1)[1]
          normalized = normalized.strip().strip("'").strip('"')
          normalized = re.sub(r"\\s+", "", normalized).replace("-", "+").replace("_", "/")
          normalized += "=" * ((-len(normalized)) % 4)

          try:
              decoded = base64.b64decode(normalized, validate=True)
          except Exception as exc:
              raise SystemExit(
                  "ANDROID_KEYSTORE_BASE64 is present but is not valid Base64 "
                  "after safe whitespace/URL-safe normalization. Check that the "
                  "GitHub secret contains the complete Base64 text."
              ) from exc

          if not decoded:
              raise SystemExit("Decoded keystore is empty.")

          # JKS magic or ZIP-based PKCS12 container; keytool performs final validation.
          if not (decoded.startswith(bytes.fromhex("feedfeed")) or decoded.startswith(b"PK")):
              raise SystemExit(
                  "Decoded data is not recognized as a JKS or PKCS12 keystore. "
                  "The secret may contain a different file or an incomplete encoding."
              )

          Path(os.environ["KEYSTORE_PATH"]).write_bytes(decoded)
          print(f"Keystore decoded successfully ({len(decoded)} bytes); contents are not printed.")
          PY

          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Keystore format, password, and configured alias validated successfully."

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mumin-release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease --project-dir android

      - name: Verify package and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "package: name='com.mumin.aitrader'"
          mkdir -p dist
          cp "$APK" dist/Mumin-AI-Trader.apk
          sha256sum dist/Mumin-AI-Trader.apk | tee dist/SHA256SUMS.txt

      - name: Determine release tag
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$REF_NAME"
          else
            TAG="v$INPUT_VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Mumin AI Trader ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/Mumin-AI-Trader.apk
            dist/SHA256SUMS.txt
