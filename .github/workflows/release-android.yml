name: Mumin AI Trader Signed Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.2.0"
        required: true
        default: "1.2.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Decode and validate private signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/mumin-release-key.jks"
          export KEYSTORE_PATH

          python - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          value = os.environ.get("ANDROID_KEYSTORE_BASE64", "").lstrip("\ufeff")
          if not value.strip():
              raise SystemExit("ANDROID_KEYSTORE_BASE64 is empty.")

          # Accept either a raw Base64 value or a complete secrets-file paste.
          # When a key/value label is present, extract only its value and stop
          # at the next ANDROID_* assignment (including assignments with values).
          lines = value.splitlines()
          extracted = None
          for index, line in enumerate(lines):
              match = re.match(r"^\s*ANDROID_KEYSTORE_BASE64\s*[:=]\s*(.*)$", line)
              if match:
                  parts = [match.group(1)] if match.group(1) else []
                  for following in lines[index + 1:]:
                      if re.match(r"^\s*ANDROID_[A-Z0-9_]+\s*[:=]", following):
                          break
                      parts.append(following)
                  extracted = "\n".join(parts)
                  break
          if extracted is not None:
              value = extracted

          # Normalize mobile clipboard artifacts without exposing the secret.
          value = value.lstrip("\ufeff")
          value = re.sub(r"(?m)^\s*`{3}[^\n]*$|^\s*`{3}\s*$", "", value)
          normalized = value.strip().replace("\\n", "").replace("\\r", "")
          normalized = re.sub(r"^data:[^,]*;base64,", "", normalized, flags=re.I)
          if normalized.lower().startswith("base64:"):
              normalized = normalized.split(":", 1)[1]
          normalized = normalized.strip().strip("'").strip('"')
          # Remove invisible Unicode characters commonly introduced by mobile copy/paste.
          for invisible in ("\ufeff", "\u200b", "\u200c", "\u200d", "\u2060"):
              normalized = normalized.replace(invisible, "")
          normalized = re.sub(r"\s+", "", normalized).replace("-", "+").replace("_", "/")
          # Repair every clipboard-corrupted character verified against the
          # original 3,700-character Base64 source. chr() avoids Unicode-escape
          # ambiguity in YAML/Python quoting. Only exact observed values are changed.
          verified_repairs = {
              83: (chr(0x0441), "C"),
              84: (chr(0x0432), "B"),
              85: (chr(0x0430), "a"),
              609: ("@", "0"),
              918: ("@", "0"),
              1448: ("@", "4"),
              1581: ("@", "y"),
              1658: ("@", "D"),
              2237: ("@", "r"),
              2470: ("@", "e"),
              2807: ("@", "A"),
              3168: ("@", "N"),
              3393: ("@", "o"),
              # The verified source has one final data character followed by
              # a single '='. A damaged clipboard copy had two '=' padding
              # characters, dropping the final decoded byte.
              3698: ("=", "A"),
          }
          for position, (observed, trusted) in verified_repairs.items():
              if len(normalized) > position and normalized[position] == observed:
                  normalized = normalized[:position] + trusted + normalized[position + 1:]
          normalized += "=" * ((-len(normalized)) % 4)

          try:
              decoded = base64.b64decode(normalized, validate=True)
          except Exception as exc:
              alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/="
              invalid = [(i, ord(ch)) for i, ch in enumerate(normalized) if ch not in alphabet]
              if invalid:
                  preview = invalid[:40]
                  detail = "invalid_characters=" + ",".join(
                      f"{position}:U+{codepoint:04X}" for position, codepoint in preview
                  )
                  if len(invalid) > len(preview):
                      detail += f",and_{len(invalid) - len(preview)}_more"
              else:
                  detail = f"base64_length={len(normalized)}, remainder_mod_4={len(normalized) % 4}"
              raise SystemExit(
                  "ANDROID_KEYSTORE_BASE64 could not be decoded. Safe diagnostic: "
                  + detail
                  + ". The secret value itself is never printed."
              ) from exc

          if not decoded:
              raise SystemExit("Decoded keystore is empty.")

          # Fail closed unless the decoded bytes exactly match the trusted original
          # keystore. This detects any remaining clipboard corruption, including
          # valid-Base64 characters that would otherwise decode silently.
          import hashlib
          expected_sha256 = "2000f0797ff56c2a79f49a3ea38730fe0f643b5a2f32ab119222ec4afd4b183b"
          actual_sha256 = hashlib.sha256(decoded).hexdigest()
          if len(decoded) != 2774 or actual_sha256 != expected_sha256:
              print(
                  "SAFE_DIAGNOSTIC "
                  f"normalized_base64_length={len(normalized)} "
                  f"decoded_bytes={len(decoded)} "
                  f"decoded_sha256={actual_sha256} "
                  f"expected_bytes=2774 "
                  f"expected_sha256={expected_sha256}"
              )
              raise SystemExit(
                  "Decoded keystore does not match the verified original. "
                  "Only lengths and SHA-256 fingerprints were reported; "
                  "the secret and keystore contents were not printed."
              )

          # JKS magic or ZIP-based PKCS12 container; keytool performs final validation.
          if not (decoded.startswith(bytes.fromhex("feedfeed")) or decoded.startswith(b"PK") or decoded.startswith(b"\x30")):
              raise SystemExit(
                  "Decoded data is not recognized as a JKS or PKCS12 keystore. "
                  "The secret may contain a different file or an incomplete encoding."
              )

          Path(os.environ["KEYSTORE_PATH"]).write_bytes(decoded)
          print(f"Keystore decoded successfully ({len(decoded)} bytes); contents are not printed.")
          PY

          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Keystore format, password, and configured alias validated successfully."

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mumin-release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease --project-dir android

      - name: Verify package and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "package: name='com.mumin.aitrader'"
          mkdir -p dist
          cp "$APK" dist/Mumin-AI-Trader.apk
          sha256sum dist/Mumin-AI-Trader.apk | tee dist/SHA256SUMS.txt

      - name: Determine release tag
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$REF_NAME"
          else
            TAG="v$INPUT_VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Mumin AI Trader ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/Mumin-AI-Trader.apk
            dist/SHA256SUMS.txt
