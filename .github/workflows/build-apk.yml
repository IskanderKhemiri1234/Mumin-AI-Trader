name: Build Mumin AI Trader APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mumin-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android 35 SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and stage APK
        run: |
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/Mumin-AI-Trader.apk
          test -s dist/Mumin-AI-Trader.apk
          sha256sum dist/Mumin-AI-Trader.apk | tee dist/Mumin-AI-Trader.apk.sha256
          ls -lh dist/Mumin-AI-Trader.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Mumin-AI-Trader-Android-APK
          path: |
            dist/Mumin-AI-Trader.apk
            dist/Mumin-AI-Trader.apk.sha256
          if-no-files-found: error
          retention-days: 30
