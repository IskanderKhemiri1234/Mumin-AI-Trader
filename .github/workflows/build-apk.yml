name: Mumin AI Trader Android APK

on:
  push:
    branches: [main, feature/android-paper-dashboard]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug --project-dir android

      - name: Verify APK and prepare download
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "package: name='com.mumin.aitrader'"
          mkdir -p dist
          cp "$APK" dist/Mumin-AI-Trader.apk
          sha256sum dist/Mumin-AI-Trader.apk | tee dist/SHA256SUMS.txt
          ls -lh dist/Mumin-AI-Trader.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mumin-AI-Trader-APK
          path: |
            dist/Mumin-AI-Trader.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
