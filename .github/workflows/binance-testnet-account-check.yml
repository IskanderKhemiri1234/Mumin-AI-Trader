name: Binance Spot Testnet Account Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mumin-binance-testnet-account-check
  cancel-in-progress: false

jobs:
  verify-testnet-account:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TRADING_ENV: TESTNET
      TRADING_MODE: PAPER
      ALLOW_MAINNET: "false"
      LIVE_TRADING_ENABLED: "false"
      INITIAL_CAPITAL_USD: "70.00"
      MAX_CAPITAL_ALLOCATION_USD: "70.00"
      BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
      BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Verify read-only Testnet account access
        run: python scripts/check_binance_testnet_account.py
