name: Mumin AI Trader CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src config scripts tests
      - name: Test
        run: pytest -q
      - name: Lint
        run: ruff check --select E4,E7,E9,F src config scripts tests

  paper-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Prepare isolated paper environment
        run: |
          cp .env.example .env
          mkdir -p data
          chmod 777 data
          echo 'MUMIN_MARKET_DATA_SOURCE=MOCK_SYNTHETIC' >> .env
          grep -q '^TRADING_ENV=TESTNET$' .env
          grep -q '^TRADING_MODE=PAPER$' .env
          grep -q '^ALLOW_MAINNET=false$' .env
          grep -q '^LIVE_TRADING_ENABLED=false$' .env
      - name: Build container image
        run: docker compose build
      - name: Start API and continuous Paper bot
        run: |
          docker compose up -d
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Verify continuous multi-symbol Paper loop
        run: |
          for attempt in $(seq 1 30); do
            if docker exec mumin-paper-bot python -c "import sqlite3; db=sqlite3.connect('/app/data/mumin_public_paper.db'); assert db.execute('SELECT COUNT(*) FROM bot_market_ticks').fetchone()[0] >= 3"; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs mumin-paper-bot
          exit 1
      - name: Run one-time offline synthetic Paper trade
        run: |
          docker compose run --name mumin-paper-smoke --entrypoint python mumin-ai-trader scripts/run_mock_paper.py
          docker cp mumin-paper-smoke:/app/data/mumin_mock_paper.db data/mumin_mock_paper.db
          docker rm mumin-paper-smoke
      - name: Preserve continuous Paper ledger
        if: always()
        run: |
          docker cp mumin-paper-bot:/app/data/mumin_public_paper.db data/mumin_public_paper.db || true
      - name: Verify exported multi-symbol ledger
        if: always()
        run: |
          if [ -f data/mumin_public_paper.db ]; then
            python -c "import sqlite3; db=sqlite3.connect('data/mumin_public_paper.db'); symbols={r[0] for r in db.execute('SELECT DISTINCT symbol FROM bot_market_ticks')}; assert symbols == {'BTCUSDT','ETHUSDT','BNBUSDT'}, symbols"
          fi
      - name: Preserve Paper ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mumin-paper-ledgers
          path: data/
          if-no-files-found: warn
          retention-days: 30
      - name: Stop containers
        if: always()
        run: docker compose down
