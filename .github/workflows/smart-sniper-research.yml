name: Smart Sniper Historical Walk-Forward Research

on:
  pull_request:
    branches: [main]
    paths:
      - "src/mumin_trader/strategy/**"
      - "src/mumin_trader/risk/**"
      - "src/mumin_trader/research/**"
      - "src/mumin_trader/exchanges/binance/public_market_data.py"
      - "scripts/run_binance_walk_forward.py"
      - ".github/workflows/smart-sniper-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-research:
    name: Public Binance data and spread-sensitivity walk-forward
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Fetch closed public candles and run out-of-sample folds
        run: |
          python scripts/run_binance_walk_forward.py \
            --symbols BTCUSDT,ETHUSDT,BNBUSDT \
            --interval 1m \
            --limit 1000 \
            --warmup-bars 240 \
            --test-bars 120 \
            --step-bars 120 \
            --spread-scenarios 5,10,20 \
            --output artifacts/smart-sniper-walk-forward.json
      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: smart-sniper-walk-forward-${{ github.run_number }}
          path: artifacts/smart-sniper-walk-forward.json
          if-no-files-found: error
          retention-days: 30
