name: Liquidity Confirmation - Sealed Holdout

on:
  workflow_run:
    workflows:
      - Liquidity Confirmation - Quality Gates
    types:
      - completed
    branches:
      - research/liquidity-confirmation-ablation

permissions:
  contents: read

jobs:
  paired-sealed-holdout:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'research/liquidity-confirmation-ablation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout the exact quality-gated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Run paired development, validation, and one sealed holdout evaluation
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python scripts/run_liquidity_confirmation_holdout.py \
            --output artifacts/liquidity-confirmation-holdout.json
      - name: Upload immutable research ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidity-confirmation-holdout-${{ github.event.workflow_run.head_sha }}
          path: artifacts/liquidity-confirmation-holdout.json
          if-no-files-found: warn
          retention-days: 90
