name: Smart Sniper Entry Scarcity Diagnostic

on:
  push:
    branches:
      - research/entry-scarcity-mtf-momentum
    paths:
      - "scripts/run_entry_scarcity_diagnostic.py"
      - "scripts/run_binance_walk_forward.py"
      - "src/mumin_trader/strategy/**"
      - "src/mumin_trader/risk/**"
      - ".github/workflows/entry-scarcity-diagnostic.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entry-scarcity-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Closed-candle MTF and momentum attribution (Paper research only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and research checks
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile source and scripts
        run: python -m compileall -q src scripts
      - name: Run test suite
        run: pytest -q
      - name: Lint diagnostic
        run: ruff check scripts/run_entry_scarcity_diagnostic.py
      - name: Run closed-candle entry-scarcity attribution
        run: |
          mkdir -p artifacts
          python scripts/run_entry_scarcity_diagnostic.py \
            --symbols BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,LINKUSDT \
            --interval 1h \
            --limit 10000 \
            --spread-scenarios 5,10,20,30 \
            --output artifacts/smart-sniper-entry-scarcity-diagnostic.json
      - name: Upload detailed diagnostic ledger
        uses: actions/upload-artifact@v4
        with:
          name: smart-sniper-entry-scarcity-${{ github.run_number }}
          path: artifacts/smart-sniper-entry-scarcity-diagnostic.json
          if-no-files-found: error
          retention-days: 30
