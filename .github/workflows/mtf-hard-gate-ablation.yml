name: Smart Sniper MTF Hard-Gate Ablation

on:
  push:
    branches:
      - research/mtf-hard-gate-ablation
    paths:
      - "scripts/run_mtf_hard_gate_ablation.py"
      - "scripts/run_binance_walk_forward.py"
      - "src/mumin_trader/strategy/smart_sniper.py"
      - "src/mumin_trader/research/walk_forward.py"
      - "src/mumin_trader/risk/**"
      - ".github/workflows/mtf-hard-gate-ablation.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mtf-hard-gate-ablation
  cancel-in-progress: false

jobs:
  ablation:
    name: Paired 70-15-15 Paper-only MTF ablation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and research checks
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile source and scripts
        run: python -m compileall -q src scripts
      - name: Run test suite
        run: pytest -q
      - name: Lint ablation runner
        run: ruff check scripts/run_mtf_hard_gate_ablation.py
      - name: Run preregistered paired ablation
        run: |
          mkdir -p artifacts
          python scripts/run_mtf_hard_gate_ablation.py \
            --limit 9940 \
            --output artifacts/smart-sniper-mtf-hard-gate-ablation.json
      - name: Upload complete paired report
        uses: actions/upload-artifact@v4
        with:
          name: smart-sniper-mtf-hard-gate-ablation-${{ github.run_number }}
          path: artifacts/smart-sniper-mtf-hard-gate-ablation.json
          if-no-files-found: error
          retention-days: 30
