name: Mumin Qualified Walk-Forward Research

on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mumin-qualified-walk-forward
  cancel-in-progress: false

jobs:
  walk-forward:
    name: Run frozen-strategy walk-forward only on qualified data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          ref: main
          path: application

      - name: Checkout append-only research archive
        uses: actions/checkout@v4
        with:
          ref: mumin-research-data
          path: research-data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: application/pyproject.toml

      - name: Install frozen replay implementation
        working-directory: application
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Find newest archive and enforce formal data gates
        id: dataset
        run: |
          set -euo pipefail
          MANIFEST="$(find research-data/datasets -type f -name '*.manifest.json' 2>/dev/null | sort | tail -n 1)"
          if [ -z "$MANIFEST" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=No immutable observation manifest exists yet." >> "$GITHUB_OUTPUT"
            echo "No dataset found; Walk-forward skipped safely." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ARCHIVE="${MANIFEST%.manifest.json}.jsonl.gz"
          if [ ! -s "$ARCHIVE" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=Newest manifest has no matching archive file." >> "$GITHUB_OUTPUT"
            echo "Newest archive file is missing; Walk-forward skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - "$MANIFEST" "$ARCHIVE" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path
          manifest_path, archive_path, output_path = map(Path, sys.argv[1:])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          quality = manifest.get("quality", {})
          cycles = int(manifest.get("observed_cycle_count", 0))
          ready = bool(quality.get("replay_ready")) and cycles >= 120
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"eligible={'true' if ready else 'false'}\n")
              output.write(f"manifest={manifest_path}\n")
              output.write(f"archive={archive_path}\n")
              output.write(f"archive_sha256={manifest.get('archive_sha256', '')}\n")
              output.write(f"cycles={cycles}\n")
              output.write(
                  "reason=" + (
                      "Dataset passed replay_ready and 120-cycle minimum."
                      if ready else
                      f"Not eligible: replay_ready={quality.get('replay_ready')}, cycles={cycles}, required=120."
                  ) + "\n"
              )
          print(json.dumps({
              "archive_sha256": manifest.get("archive_sha256"),
              "replay_ready": quality.get("replay_ready"),
              "observed_cycle_count": cycles,
              "eligible": ready,
          }, indent=2))
          PY
          {
            echo
            echo "## Walk-forward dataset gate"
            echo "- Manifest: $MANIFEST"
            echo "- Archive: $ARCHIVE"
            cat "$GITHUB_OUTPUT" | tail -n 5
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run three chronological out-of-sample folds
        if: steps.dataset.outputs.eligible == 'true'
        working-directory: application
        run: |
          python scripts/run_paper_walk_forward.py \
            --archive "../${{ steps.dataset.outputs.archive }}" \
            --manifest "../${{ steps.dataset.outputs.manifest }}" \
            --output "$RUNNER_TEMP/walk-forward-result.json" \
            --folds 3

      - name: Preserve walk-forward report in research branch
        if: steps.dataset.outputs.eligible == 'true'
        env:
          ARCHIVE_SHA: ${{ steps.dataset.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%F)"
          DEST="research-data/reports/walk-forward"
          mkdir -p "$DEST"
          REPORT="$DEST/$DATE-$ARCHIVE_SHA.json"
          cp "$RUNNER_TEMP/walk-forward-result.json" "$REPORT"
          git -C research-data config user.name "github-actions[bot]"
          git -C research-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C research-data add "$REPORT"
          if git -C research-data diff --cached --quiet; then
            echo "Walk-forward report already exists for this archive."
          else
            git -C research-data commit -m "Record qualified walk-forward $DATE $ARCHIVE_SHA"
            git -C research-data push origin HEAD:mumin-research-data
          fi

      - name: Upload reproducible walk-forward result
        if: steps.dataset.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mumin-walk-forward-${{ github.run_number }}
          path: ${{ runner.temp }}/walk-forward-result.json
          if-no-files-found: error
          retention-days: 90

      - name: Report skipped evaluation
        if: steps.dataset.outputs.eligible != 'true'
        run: |
          {
            echo
            echo "## Walk-forward not run"
            echo "${{ steps.dataset.outputs.reason }}"
            echo "No ineligible dataset is replayed, and no metrics are inferred."
          } >> "$GITHUB_STEP_SUMMARY"
