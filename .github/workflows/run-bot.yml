name: Mumin Mock Paper Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      cycles:
        description: "Number of simulation cycles"
        required: true
        type: choice
        default: "120"
        options:
          - "40"
          - "120"
          - "240"

permissions:
  contents: read

concurrency:
  group: mumin-mock-paper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mock-paper:
    name: Run synthetic Paper simulation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MUMIN_MARKET_DATA_SOURCE: MOCK_SYNTHETIC
      MUMIN_DB_PATH: data/mumin_mock_actions.sqlite3
      TRADING_ENV: TESTNET
      TRADING_MODE: PAPER
      ALLOW_MAINNET: "false"
      LIVE_TRADING_ENABLED: "false"
      INITIAL_CAPITAL_USD: "50.00"
      CYCLES: ${{ github.event.inputs.cycles || '120' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the Paper engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Restore previous Mock SQLite ledger
        uses: actions/cache/restore@v4
        with:
          path: data/mumin_mock_actions.sqlite3
          key: mumin-mock-ledger-v1-${{ github.run_id }}
          restore-keys: |
            mumin-mock-ledger-v1-

      - name: Run finite Mock-only Paper session
        run: |
          mkdir -p data reports
          python scripts/run_continuous_paper.py \
            --db "$MUMIN_DB_PATH" \
            --interval-seconds 2 \
            --cycles "$CYCLES" \
            --data-source MOCK_SYNTHETIC

      - name: Verify and publish Job Summary and CSV reports
        if: always()
        run: |
          if [ -f "$MUMIN_DB_PATH" ]; then
            python scripts/write_github_actions_summary.py
          else
            echo "## Mumin Mock Paper report" >> "$GITHUB_STEP_SUMMARY"
            echo "The SQLite ledger was not created; inspect the job logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkpoint SQLite before saving
        if: always()
        run: |
          if [ -f "$MUMIN_DB_PATH" ]; then
            python - <<'PY'
          import os
          import sqlite3
          path = os.environ["MUMIN_DB_PATH"]
          db = sqlite3.connect(path)
          db.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          db.execute("PRAGMA journal_mode=DELETE")
          db.close()
          PY
          fi

      - name: Save ledger for the next scheduled run
        if: success() && hashFiles('data/mumin_mock_actions.sqlite3') != ''
        uses: actions/cache/save@v4
        with:
          path: data/mumin_mock_actions.sqlite3
          key: mumin-mock-ledger-v1-${{ github.run_id }}

      - name: Upload SQLite ledger and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mumin-mock-paper-${{ github.run_number }}
          path: |
            data/mumin_mock_actions.sqlite3
            reports/
          if-no-files-found: warn
          retention-days: 30
