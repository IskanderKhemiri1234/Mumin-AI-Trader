services:
  mumin-ai-trader:
    build: .
    container_name: mumin-ai-trader
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - mumin_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  mumin-paper-bot:
    build: .
    env_file:
      - .env
    container_name: mumin-paper-bot
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sqlite3,sys; from datetime import datetime,timezone; db=sqlite3.connect('/app/data/mumin_public_paper.db'); row=db.execute('SELECT supervisor_heartbeat_at FROM bot_runtime_control WHERE id=1').fetchone(); age=(datetime.now(timezone.utc)-datetime.fromisoformat(row[0])).total_seconds() if row and row[0] else 999999; sys.exit(0 if -5 <= age <= 90 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: ["python", "scripts/paper_worker_supervisor.py", "--db", "/app/data/mumin_public_paper.db", "--interval-seconds", "30", "--data-source", "${MUMIN_MARKET_DATA_SOURCE:-BINANCE_PUBLIC_MARKET_DATA}", "--restart-initial-seconds", "2", "--restart-max-seconds", "60"]
    restart: unless-stopped
    volumes:
      - mumin_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      mumin-ai-trader:
        condition: service_started

volumes:
  mumin_data:
