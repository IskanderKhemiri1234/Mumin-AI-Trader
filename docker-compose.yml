services:
  mumin-ai-trader:
    build: .
    container_name: mumin-ai-trader
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - mumin_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  mumin-paper-bot:
    build: .
    container_name: mumin-paper-bot
    command: ["python", "scripts/run_continuous_paper.py", "--db", "/app/data/mumin_continuous_paper.db", "--interval-seconds", "30"]
    restart: unless-stopped
    volumes:
      - mumin_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      mumin-ai-trader:
        condition: service_started

volumes:
  mumin_data:
